[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["macros"]
# Enables compatibility with Rust libtest (like outputting in its JSON format).
libtest = ["dep:serde", "dep:serde_json", "timestamps"]
# Enables step attributes and auto-wiring.
macros = [
    "dep:anyhow",
    "dep:cucumber-codegen",
    "dep:cucumber-expressions",
    "dep:inventory",
]
# Enables support for outputting in Cucumber JSON format.
output-json = [
    "dep:base64",
    "dep:Inflector",
    "dep:mime",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_with",
    "timestamps",
]
# Enables the explicitly bounded Cucumber Messages 34.2.1 NDJSON writer.
output-messages = ["dep:serde_json", "dep:base64", "timestamps"]
# Enables support for outputting JUnit XML report.
output-junit = ["dep:junit-report", "timestamps"]
# Enables timestamps collecting for all events.
timestamps = []
# Enables integraion with `tracing` crate.
tracing = ["dep:crossbeam-utils", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
clap = { version = "4.3.2", features = ["derive", "env", "wrap_help"] }
console = "0.16"
derive_more = { version = "2.0", features = ["as_ref", "debug", "deref", "deref_mut", "display", "error", "from", "from_str", "into"] }
either = "1.6"
futures = "0.3.32"
futures-timer = "=3.0.4"
gherkin = { version = "0.16", path = "vendor/gherkin" }
globwalk = "0.9"
humantime = "2.1"
itertools = "0.15"
linked-hash-map = "0.5.3"
pin-project = "1.0"
ref-cast = "1.0.16"
regex = "1.9"
regex-syntax = "0.8"
sealed = "0.6"
smart-default = "0.7.1"

# "macros" feature dependencies.
anyhow = { version = "1.0.58", optional = true }
cucumber-codegen = { version = "=0.23.0", path = "./codegen", optional = true }
cucumber-expressions = { version = "0.5", features = ["into-regex"], optional = true }
inventory = { version = "0.3", optional = true }

# "output-json" and/or "libtest" features dependencies.
base64 = { version = "0.22", optional = true }
Inflector = { version = "0.11", default-features = false, optional = true }
mime = { version = "0.3.16", optional = true }
serde = { version = "1.0.157", features = ["derive"], optional = true }
serde_json = { version = "1.0.18", optional = true }
serde_with = { version = "3.0", features = ["macros"], default-features = false, optional = true }

# "output-junit" feature dependencies.
junit-report = { version = "0.9", optional = true }

# "tracing" feature dependencies.
crossbeam-utils = { version = "0.8.14", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3.16", optional = true }

[dev-dependencies]
# Keep jsonschema's minimum IDNA graph on ICU 2: ICU 1.4's zerovec 0.10
# allows yoke 0.6 beside its required yoke 0.7, which cannot share Yokeable.
# Both bounds are needed: older idna bypasses the adapter entirely.
idna = "1.0.3"
idna_adapter = "1.2.1"
# Earlier bigint releases conflict with modern integer div_ceil methods.
num-bigint = { version = "0.4.3", default-features = false }
jsonschema = { version = "=0.33.0", default-features = false }
rand = "0.10"
serial_test = "3.0"
tempfile = "3.2"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time"] }

